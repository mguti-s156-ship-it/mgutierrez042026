<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <style>
        /* Mobile First Design */
        body {
            margin: 0;
            padding: 0;
        }

        #pageheader {
            background-color: aqua;
            padding: 1rem;
            border-bottom: 1px solid silver;
        }

        #logo {
            width: 100px;
            height: 100px;
            background-color: blueviolet;
            border-radius: 50%;
            border: 2px solid brown;
            margin: auto;
            margin-bottom: 1rem;
        }

        #pageheader nav {
            background-color: crimson;
            padding: 1rem;
        }

        #pageheader ul {
            background-color: blanchedalmond;
            list-style-type: none;
            padding: 0;
        }

        #pageheader li {
            text-align: center;
            padding: 1rem;
            border: 1px solid silver;
            color: gray;
        }

        /* Table and Desktop Design */
        @media screen and (min-width:700px) {
            #pageheader {
                display: flex;
                justify-content: space-between;
            }

            #logo {
                margin: 0;
            }

        }
    </style>
</head>

<body>
    <header id="pageheader">
        <div id="logo"></div>
        <nav>
            <ul>
                <li>Home</li>
                <li>Why Adopt</li>
                <li>Pet Gallery</li>
                <li>Testimonials</li>
            </ul>
        </nav>


    </header>
</body>

</html>
